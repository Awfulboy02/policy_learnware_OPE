[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-learnware-ope"
version = "0.4.0b0"
description = "Finite-horizon OPE companion for frozen Policy Learnware assets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy==2.5.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
policy-learnware-ope = "policy_learnware_ope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
